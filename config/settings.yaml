app:
  name: AI Viral Clipper
  version: 1.0.0
  log_level: INFO
  cache_dir: ./cache
  temp_dir: ./temp
  output_dir: ./output
gpu:
  enabled: true
  device_id: 0
  fallback_to_cpu: true
  memory_fraction: 0.8
whisper:
  model: large-v3
  device: cuda
  compute_type: float16
  language: en
  beam_size: 1
  vad_filter: true
  vad_parameters:
    min_silence_duration_ms: 500
    speech_pad_ms: 400
audio:
  sample_rate: 16000
  n_mfcc: 13
  hop_length: 512
  n_fft: 2048
  vad_aggressiveness: 3
  min_speech_duration: 0.5
  max_silence_duration: 2.0
video:
  face_detection:
    model: buffalo_l
    det_size:
    - 640
    - 640
    cpu_det_size:
    - 480
    - 480
    threshold: 0.5
  emotion_detection:
    enabled: false
    model: resnet50
  motion_detection:
    enabled: true
    enable_on_cpu: false
    history: 500
    var_threshold: 16
  scene_detection:
    enabled: true
    threshold: 0.3
    min_scene_length: 15
scoring:
  weights:
    hook_strength: 0.25
    emotion_level: 0.2
    retention_potential: 0.2
    speech_energy: 0.15
    visual_activity: 0.1
    uniqueness: 0.1
  thresholds:
    min_viral_score: 40
    min_clip_duration: 15
    max_clip_duration: 1200
    overlap_threshold: 0.1
    min_gap_between_clips: 5.0
shorts:
  target_resolution:
  - 1080
  - 1920
  aspect_ratio: '9:16'
  face_tracking:
    enabled: true
    smoothing: 0.3
    zoom_factor: 1.2
    cpu_det_size:
    - 480
    - 480
  auto_reframe:
    enabled: true
    padding: 0.15
  auto_zoom:
    enabled: true
    trigger_on:
    - emotion_peak
    - keyword
    - gesture
    zoom_range:
    - 1.0
    - 1.5
subtitles:
  enabled: true
  style: boxed_tiktok
  font_family: Arial
  font_size: 60
  font_color: '#FFFFFF'
  outline_color: '#000000'
  outline_width: 3
  highlight_color: '#FFD700'
  position: bottom
  margin_bottom: 150
  max_chars_per_line: 32
  word_level_highlight: true
  emoji_enabled: true
  styles:
    tiktok:
      font: Montserrat
      size: 65
      color: '#FFFFFF'
      highlight: '#FF2D55'
      animation: pop
    youtube:
      font: Roboto
      size: 58
      color: '#FFFFFF'
      highlight: '#FF0000'
      animation: fade
    instagram:
      font: San Francisco
      size: 60
      color: '#FFFFFF'
      highlight: '#E1306C'
      animation: slide
selection:
  max_clips: 50
  diversity_factor: 0.3
  prefer_complete_sentences: true
  expand_boundaries: true
  boundary_expansion: 2.0
  min_score_fallback: true
candidates:
  enabled: true
  min_duration: 15.0
  max_duration: 1200.0
  stride: 6.0
  merge_gap: 1.5
  tail_pad: 0.3
  snap_silence: 0.15
llm:
  enabled: false
  provider: gemini
  model: ''
  blend_weight: 0.6
  max_candidates: 25
  transcript_chars: 600
  timeout_seconds: 60.0
  key_env:
    gemini: GEMINI_API_KEY
    openai: OPENAI_API_KEY
    anthropic: ANTHROPIC_API_KEY
export:
  codec: libx264
  preset: medium
  crf: 20
  audio_codec: aac
  audio_bitrate: 128k
  threads: 4
  hardware_accel: true
processing:
  max_workers: 4
  batch_size: 32
  checkpoint_interval: 30
  resume_enabled: true
